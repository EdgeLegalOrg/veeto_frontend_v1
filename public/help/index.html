<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Veeto Help</title>
    <script>
      // Reached as /help with no closing slash: add it, so the page finds its style, scripts and content.
      if (/\/help$/.test(location.pathname)) {
        location.replace(location.pathname + "/" + location.search + location.hash);
      }
    </script>
    <link rel="stylesheet" href="assets/help.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to the page</a>

    <header class="top">
      <button type="button" class="menu-button" id="menu-button" aria-expanded="false" aria-controls="sidebar">Menu</button>
      <a class="brand" href="#/">Veeto <span>Help</span></a>
      <div class="search">
        <label class="visually-hidden" for="search-box">Search the help</label>
        <input id="search-box" type="search" placeholder="Search the help" autocomplete="off" />
      </div>
    </header>

    <div class="layout">
      <nav class="sidebar" id="sidebar" aria-label="Help contents">
        <div id="results" class="results" hidden aria-live="polite"></div>
        <div id="nav"></div>
      </nav>

      <main id="main" class="main" tabindex="-1">
        <article id="article" class="article" aria-live="polite">
          <p>Loading…</p>
        </article>
        <nav id="pager" class="pager" aria-label="Previous and next page"></nav>
        <footer class="foot">Veeto help. The text is kept with the application and changes with each release.</footer>
      </main>

      <aside class="toc" id="toc" aria-label="On this page" hidden></aside>
    </div>

    <noscript>This help needs JavaScript to load its pages.</noscript>
    <script src="assets/help.js"></script>
  </body>
</html>
